<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Phoenix 2.5D</title>
<meta name="description" content="A 2.5D remake of the classic arcade shooter Phoenix, built with Three.js.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23050b14'/%3E%3Cpath d='M16 5l9 21-9-5-9 5z' fill='%232dd4bf'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-row">
    <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
    <div class="stat center"><span class="label">High Score</span><span id="hi" class="value amber">0</span></div>
    <div class="stat right"><span class="label">Wave</span><span id="wave" class="value">1</span></div>
  </div>
  <div class="hud-row">
    <div id="lives" aria-label="Lives"></div>
    <div class="shield"><span class="label">Shield</span><div class="meter"><div id="shield-fill"></div></div></div>
  </div>
</div>

<div id="banner"><div id="banner-title"></div><div id="banner-sub"></div></div>

<div id="touch">
  <div class="pad">
    <button data-k="left" aria-label="Move left">&#9664;</button>
    <button data-k="right" aria-label="Move right">&#9654;</button>
  </div>
  <div class="pad">
    <button data-k="shield" class="small" aria-label="Shield">Shield</button>
    <button data-k="fire" class="fire" aria-label="Fire">Fire</button>
  </div>
</div>

<div id="modal" class="backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div id="m-kicker" class="kicker"></div>
    <h1 id="m-title"></h1>
    <div id="m-body"></div>
    <button id="m-btn" type="button"></button>
    <a id="m-classic" href="classic.html" hidden>Play the Classic 1980 version</a>
    <div id="m-links" hidden>
      <button id="m-scores" type="button">High Scores</button>
      <button id="m-alt" type="button">About &amp; Credits</button>
    </div>
  </div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
